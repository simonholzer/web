<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rothirsch Hub</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0b0d;
      color: #f2f2f2;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: -2;
    }

    header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3rem 1.5rem 2rem;
    }

    /* --- FLEXBOX FÜR DIE ÜBERSCHRIFT-ZEILE --- */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center; /* Vertikale Zentrierung zur Überschrift */
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3.6rem);
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 0; /* Margin entfernt, da Container das regelt */
    }

    /* --- DER NEUE BUTTON STIL --- */
    .btn-back {
      color: #cfcbff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid rgba(207, 203, 255, 0.3);
      padding: 0.6rem 1.5rem;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
      white-space: nowrap; /* Verhindert Zeilenumbruch im Button */
    }

    .btn-back:hover {
      background: rgba(207, 203, 255, 0.15);
      border-color: #cfcbff;
      transform: translateY(-2px);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .card {
      position: relative;
      border-radius: 1.2rem;
      overflow: hidden;
      cursor: pointer;
      background: #111;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 20px 40px rgba(0,0,0,0.6);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .card:hover {
      transform: scale(1.05) translateY(-6px);
      box-shadow: 0 0 0 1px rgba(180,160,255,0.5), 0 30px 60px rgba(0,0,0,0.8);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .card span {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 14px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.8rem;
      opacity: 0.5;
    }

    .corner-link {
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 10;
      opacity: 0.6;
    }

    .corner-link img { width: 42px; display: block; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Rothirsch Services</h1>
    <a href="index.html" class="btn-back">Zurück</a>
  </div>
  
  <div class="cards" id="cards"></div>
</header>

<footer>
  © Rothirsch Network
</footer>

<a href="https://erepfl.com" class="corner-link" target="_blank" rel="noopener">
  <img src="images/erepfl.png" alt="erepfl">
</a>

<script>
  const services = [
    { name: "Bluemap", url: "https://bluemap.rothirsch.net", img: "images/bluemap.jpg" },
    { name: "AMP", url: "https://amp.rothirsch.net", img: "images/amp.jpg" },
    { name: "Cockpit", url: "https://cockpit.rothirsch.net", img: "images/cockpit.jpg" },
    { name: "Raspi SSH", url: "https://raspi-ssh.rothirsch.net", img: "images/raspi.jpg" },
    { name: "Alarm", url: "https://alarm.rothirsch.net", img: "images/alarm.png" }
  ];

  const container = document.getElementById("cards");

  services.forEach(s => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => window.location.href = s.url;
    card.innerHTML = `
      <img src="${s.img}" alt="${s.name}">
      <span>${s.name}</span>
    `;
    container.appendChild(card);
  });
</script>

</body>
</html>
