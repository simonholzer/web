<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie der Wildnis</title>

  <style>
    /* Basis Design */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0b0d;
      color: #f2f2f2;
      min-height: 100vh;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px; z-index: -2;
    }
    body::after {
      content: ""; position: fixed; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(80, 255, 150, 0.12), transparent 70%); /* Grüner Schimmer für Natur */
      top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: -1;
    }

    /* Header & Nav */
    .header-container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.8rem; font-weight: 600; }
    
    .btn-back {
      color: #cfcbff; text-decoration: none; font-weight: 600;
      border: 1px solid rgba(207, 203, 255, 0.3); padding: 0.5rem 1.2rem; border-radius: 2rem;
      transition: 0.3s;
    }
    .btn-back:hover { background: rgba(207, 203, 255, 0.1); border-color: #cfcbff; }

    /* Grid Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem 4rem;
    }

    .card {
      background: #16161a;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.4s ease;
      /* Aspekt-Ratio Hack für gleichmäßige Bilder */
      aspect-ratio: 4/3; 
    }

    .card:hover { transform: translateY(-10px); }

    .card img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.6s ease, filter 0.4s ease;
      filter: grayscale(20%);
    }

    .card:hover img { transform: scale(1.1); filter: grayscale(0%); }

    footer { text-align: center; padding: 2rem; opacity: 0.5; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>Sichtungen</h1>
    <a href="index.html" class="btn-back">Zurück</a>
  </div>

  <section class="gallery">
    <div class="card">
      <img src="rothirsch1.jpg" alt="Hirsch 1">
    </div>
    <div class="card">
      <img src="rothirsch2.jpg" alt="Hirsch 2">
    </div>
    <div class="card">
      <img src="rothirsch3.jpg" alt="Hirsch 3">
    </div>
    <div class="card">
      <img src="rothirsch2.jpg" alt="Hirsch 4">
    </div>
    <div class="card">
      <img src="rothirsch3.jpg" alt="Hirsch 5">
    </div>
    <div class="card">
      <img src="rothirsch1.jpg" alt="Hirsch 6">
    </div>
  </section>

  <footer>© Der Rothirsch - Galerie</footer>

</body>
</html>
